<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <style>
        body, button, input, select {
            background: olive;
            color: darkred;
        }

        input::placeholder, select { 
            color: darkred; 
        }

        select { 
            border: 2px outset black; 
        }
    </style>
</head>

<body>

    <h2>del 8</h2>

    <script>
        for (let i = 0; i < 10; i++) {
            console.log(i);
        }
    </script>

    <p>Sjekk konsoll</p>


    <h2>del 9</h2>

    <p id="res9"></p>

    <script>
        const res9 = document.querySelector("#res9");
        let teller9 = "";

        for (let i = 10; i >= 1; i--) {
            teller9 += i;

            if (i > 1) teller9 += ", ";
        }

        res9.innerHTML = teller9;
    </script>


    <p id="res92"></p>

    <script>
        const res92 = document.querySelector("#res92");

        teller9 = "";

        for (let i = 10; i >= 1; i--) teller9 += i + ", ";

        teller9 = teller9.substring(0, teller9.length-2);

        res92.innerHTML = teller9;
    </script>


    <h2>del 9.3</h2>

    <script>
        console.log("del 9.3");

        const tall = [8, 3, 12, 1, 5];

        console.log(tall[0]);
        console.log(tall[1]);
        console.log(tall);

        for (let i = 0; i < tall.length; i++) {
            console.log(tall[i]);
        }

        let storst = 0;

        for (let i = 0; i < tall.length; i++) {
            if (tall[i] > storst) storst = tall[i];
        }

        console.log("Det største tallet er " + storst);
    </script>


    <h2>del 9.7</h2>

    <script>
        console.log("del 9.7");

        const tall97 = [8, 3, 12, 1, 5];

        for (let i = 0; i < tall97.length; i++) {

            for (let j = 0; j < tall97.length; j++) {

                if (tall97[i] < tall97[j]) {

                    let temp = tall97[i];

                    tall97[i] = tall97[j];

                    tall97[j] = temp;
                }
            }
        }

        console.log(tall97);
    </script>   
</body>

</html>
